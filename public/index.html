<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal YT to MP3 Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid #2d2d2d;
        }
        h1 { color: #ff3333; margin-bottom: 5px; font-size: 26px; }
        .subtitle { color: #888; font-size: 13px; margin-bottom: 25px; }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #252525;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #ff3333;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #ff3333;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background-color: #cc0000; }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #444; color: #888; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 14px; color: #ffcc00; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <h1>YT to MP3 Converter</h1>
    <div class="subtitle">Auto-Metadata & Album Art Integration (Personal Use)</div>
    
    <input type="text" id="youtubeUrl" placeholder="Paste link YouTube video / music di sini..." />
    <button id="downloadBtn" onclick="processDownload()">Download MP3</button>
    
    <div id="status"></div>
</div>

<script>
    function processDownload() {
        const urlInput = document.getElementById('youtubeUrl').value.trim();
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('downloadBtn');

        if (!urlInput) {
            statusDiv.innerHTML = "<span style='color: #ff4d4d;'>Harap masukkan URL YouTube valid!</span>";
            return;
        }

        statusDiv.innerText = "Mengambil data stream dan menyuntikkan metadata, mohon tunggu...";
        btn.disabled = true;

        // Mengarahkan window browser langsung ke endpoint download backend.
        // Ini akan langsung memicu native download dialog bawaan browser.
        window.location.href = `/download?url=${encodeURIComponent(urlInput)}`;

        // Mengembalikan tombol ke status aktif setelah beberapa saat
        setTimeout(() => {
            btn.disabled = false;
            statusDiv.innerHTML = "<span style='color: #00ffcc;'>Proses download dimulai!</span>";
        }, 6000);
    }
</script>

</body>
</html>
